<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoneVaz 🔮 - Visualizer Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <script>
        // Apply cached palette instantly (server-synced)
        try {
            const cached = JSON.parse(localStorage.getItem('zonevaz_palette_cache'));
            if (cached) {
                document.documentElement.style.setProperty('--cute-pink', cached.pink || '#ff9ebd');
                document.documentElement.style.setProperty('--cute-purple', cached.purple || '#c49fff');
                document.documentElement.style.setProperty('--bg-dark', cached.bg || '#0c0511');
                document.documentElement.style.setProperty('--card-bg', cached.card || '#130919');
            }
        } catch (e) {}
    </script>

    <style>
        :root { --bg-dark: #0c0511; --card-bg: rgba(19, 9, 25, 0.65); --border-soft: rgba(255, 255, 255, 0.08); --text-white: #e9e3ee; --text-gray: #776d82; --cute-pink: #ff9ebd; --cute-purple: #c49fff; --gradient-main: linear-gradient(90deg, var(--cute-purple), var(--cute-pink)); }
        body.theme-cyber { --bg-dark: #050a14; --card-bg: rgba(9, 16, 36, 0.7); --border-soft: rgba(0, 255, 255, 0.15); --text-white: #e0fbfc; --text-gray: #6b8a9c; --cute-pink: #00ffff; --cute-purple: #ff00ff; --gradient-main: linear-gradient(90deg, #00ffff, #ff00ff); }
        body.theme-sakura { --bg-dark: #1a0e13; --card-bg: rgba(38, 20, 28, 0.7); --border-soft: rgba(255, 183, 197, 0.15); --text-white: #fff0f5; --text-gray: #b595a2; --cute-pink: #ffb7c5; --cute-purple: #ff9ebd; --gradient-main: linear-gradient(90deg, #ff9ebd, #ffb7c5); }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Nunito', sans-serif; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; }

        .ambient-glow { position: fixed; filter: blur(140px); opacity: 0.15; z-index: -1; border-radius: 50%; pointer-events: none;}
        .glow-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--cute-purple); }
        .glow-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: var(--cute-pink); }

        /* Sleek Navbar */
        .navbar { width: 95%; max-width: 950px; margin-top: 15px; padding: 12px 20px; border: 1px solid var(--border-soft); border-radius: 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(15px); z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
        .logo { font-family: 'Quicksand', sans-serif; font-size: 1.1rem; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 5px; }
        .logo span { color: var(--cute-pink); font-size: 1.2rem; }
        .back-btn { background: rgba(255,255,255,0.05); color: var(--text-white); border: 1px solid var(--border-soft); padding: 6px 16px; border-radius: 30px; font-size: 0.8rem; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .back-btn:hover { border-color: var(--cute-pink); color: var(--cute-pink); background: rgba(255, 158, 189, 0.1); }

        @media (max-width: 750px) {
            .navbar { padding: 8px 12px; gap: 5px; flex-wrap: wrap; justify-content: center;}
            .logo { font-size: 0.95rem; margin-bottom: 5px;}
            .back-btn { padding: 4px 10px; font-size: 0.7rem; }
        }

        .main-content { width: 100%; flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; padding-bottom: 20px;}
        .main-content::-webkit-scrollbar { width: 4px; }
        .main-content::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 10px; }

        #searchStage { width: 100%; max-width: 650px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease;}
        
        .hero-text { font-family: 'Quicksand', sans-serif; font-size: 2rem; text-align: center; margin-bottom: 5px; background: var(--gradient-main); -webkit-background-clip: text; color: transparent; font-weight: 800;}
        .sub-text { color: var(--text-gray); font-size: 0.85rem; font-weight: 600; text-align: center; margin-bottom: 25px;}

        .search-container { width: 100%; margin-bottom: 25px; position: relative;}
        .search-bar { width: 100%; padding: 15px 25px; border-radius: 50px; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-white); font-size: 0.9rem; font-family: 'Nunito', sans-serif; outline: none; transition: 0.3s; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.4);}
        .search-bar:focus { border-color: var(--cute-pink); box-shadow: 0 0 20px rgba(255,158,189,0.15);}

        .results-list { width: 100%; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px;}

        .result-card { background: rgba(19, 9, 25, 0.5); border: 1px solid var(--border-soft); border-radius: 20px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px); animation: slideUp 0.4s ease forwards; opacity: 0;}
        .result-card:hover { border-color: var(--cute-pink); background: rgba(255, 158, 189, 0.08); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 158, 189, 0.15);}
        .track-info-sm h4 { color: #fff; font-size: 1.05rem; font-family: 'Quicksand', sans-serif; margin-bottom: 3px; font-weight: 700;}
        .track-info-sm p { color: var(--text-gray); font-size: 0.75rem; font-weight: 700;}
        .play-badge { background: var(--gradient-main); color: var(--bg-dark); padding: 6px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; gap: 6px; transition: 0.3s;}
        .result-card:hover .play-badge { transform: scale(1.05); }
        
        .loader-text { color: var(--cute-pink); font-size: 0.9rem; font-weight: 700; text-align: center; margin-top: 20px; animation: pulse 1s infinite alternate;}
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <nav class="navbar">
        <a href="index.html" class="logo">ZoneVaz <span>🔮</span></a>
        <a href="index.html" class="back-btn">← Back to Hub</a>
    </nav>

    <div class="main-content">
        <div id="searchStage">
            <h2 class="hero-text">Visualizer Studio</h2>
            <p class="sub-text">Search any global track to experience it in the interactive aesthetic lounge.</p>
            
            <div class="search-container">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search song & artist... (Press Enter) 🎵" autocomplete="off" onkeypress="handleSearch(event)">
            </div>
            
            <div class="results-list" id="resultsList">
                <div style="text-align: center; padding: 40px 20px; border: 1px dashed var(--border-soft); border-radius: 20px; margin-top: 10px;">
                    <p style="color: var(--text-gray); font-size: 0.85rem; font-weight: 600;">Type a song above and hit Enter to pull up the vibes. ☁️</p>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js?v=4"></script>
    <script>
        const resultsList = document.getElementById('resultsList');

        async function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                if (!query) return;

                resultsList.innerHTML = '<p class="loader-text">Searching Spotify Engine... ⏳</p>';
                
                try {
                    // Secure server-side proxy — no API keys in the browser.
                    const data = await ZV.api('/api/search?q=' + encodeURIComponent(query));

                    let tracks = extractTracks(data);
                    if (!tracks || tracks.length === 0) {
                        resultsList.innerHTML = '<p style="text-align:center; color:var(--text-gray); margin-top: 20px;">No tracks found. Try another search. 🌧️</p>'; return;
                    }
                    renderResults(tracks.slice(0, 10)); 
                } catch (error) {
                    resultsList.innerHTML = `<p style="text-align:center; color:#ff4757; font-weight:700; margin-top:20px;">❌ Search failed. The engine may be busy — try again shortly.</p>`;
                }
            }
        }

        function extractTracks(obj) {
            let res = [];
            function searchObj(item) {
                if (res.length > 0) return; 
                if (Array.isArray(item)) {
                    if (item.length > 0 && typeof item[0] === 'object' && item[0] !== null) {
                        let s = item[0];
                        if ((s && (s.id || s.trackId || s.uri)) && (s && (s.name || s.title || s.trackName))) { res = item; return; }
                    }
                    for (let i = 0; i < item.length; i++) searchObj(item[i]);
                } else if (typeof item === 'object' && item !== null) { for (let key in item) searchObj(item[key]); }
            }
            searchObj(obj); return res;
        }

        function renderResults(tracks) {
            resultsList.innerHTML = '';
            tracks.forEach((track, index) => {
                let rawId = track && (track.id || track.trackId || track.uri); 
                if(!rawId) return;
                let trackId = rawId.includes(':') ? rawId.split(':').pop() : rawId;
                let title = (track && (track.name || track.title)) || "Unknown Track";
                let artist = (track && track.artists && track.artists[0]) ? (track.artists[0].name || track.artists[0]) : "Unknown Artist";
                if (typeof artist === 'object') artist = "Unknown Artist";

                let delay = index * 0.08;

                // Build the card with safe DOM APIs (XSS-safe).
                const card = document.createElement('div');
                card.className = 'result-card';
                card.style.animationDelay = delay + 's';
                card.addEventListener('click', () => openLounge(trackId, title, artist));

                const info = document.createElement('div');
                info.className = 'track-info-sm';
                const h4 = document.createElement('h4');
                h4.textContent = title;
                const p = document.createElement('p');
                p.textContent = artist;
                info.appendChild(h4); info.appendChild(p);

                const badge = document.createElement('div');
                badge.className = 'play-badge';
                badge.textContent = '▶ Enter Lounge';

                card.appendChild(info); card.appendChild(badge);
                resultsList.appendChild(card);
            });
        }

        function openLounge(id, title, artist) {
            const url = `lounge.html?id=${encodeURIComponent(id)}&title=${encodeURIComponent(title)}&artist=${encodeURIComponent(artist)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
